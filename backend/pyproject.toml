[project]
name = "terrain-brief-api"
version = "0.1.0"
description = "Authoritative synthetic terrain, command validation, and road routing for Terrain Brief"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.121.1",
  "numpy==2.3.4",
  "pydantic==2.12.4",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
